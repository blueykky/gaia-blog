<body>

  <header class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">Carrycore<em>· 金融视觉志</em></a>
      <nav class="nav-links" aria-label="主导航">

        <a href="about.html">关于</a>
        <a href="archive.html">归档</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="post">

      <header class="post-head">
        <h1>行业强弱分布</h1>
        <time datetime="2026-08-11">2026.08.11</time>
        <p class="post-sub">波动性 × 强弱势级 · 鼠标悬停观察细节</p>
      </header>

      <div class="interactive-wrap">

        <div class="controls">
          <div class="dualfilter">
            <span>强弱</span>
            <div class="df-track" id="df-y" role="slider" aria-label="强弱范围筛选" aria-valuemin="0.30" aria-valuemax="0.65" aria-valuenow="0.30" aria-valuetext="0.30 到 0.65"></div>
            <span class="df-values" id="df-y-values">0.30 – 0.65</span>
          </div>
          <div class="dualfilter">
            <span>波动性</span>
            <div class="df-track" id="df-x" role="slider" aria-label="波动性范围筛选" aria-valuemin="0.08" aria-valuemax="0.28" aria-valuenow="0.08" aria-valuetext="0.08 到 0.28"></div>
            <span class="df-values" id="df-x-values">0.08 – 0.28</span>
          </div>
          <div class="dualfilter">
            <span>连续性</span>
            <div class="df-track" id="df-c" role="slider" aria-label="连续性范围筛选" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" aria-valuetext="0 到 10"></div>
            <span class="df-values" id="df-c-values">0 – 10</span>
          </div>
          <div class="dualfilter">
            <span>甜品度</span>
            <div class="df-track" id="df-v" role="slider" aria-label="甜品度范围筛选" aria-valuemin="-2.50" aria-valuemax="2.50" aria-valuenow="-2.50" aria-valuetext="-2.50 到 2.50"></div>
            <span class="df-values" id="df-v-values">-2.50 – 2.50</span>
          </div>
          <div class="colorfilter">
            <span>颜色</span>
            <div class="color-seg" id="color-seg" role="group" aria-label="颜色筛选">
              <button type="button" class="seg-btn active" data-color="all">全部</button>
              <button type="button" class="seg-btn" data-color="blue">蓝</button>
              <button type="button" class="seg-btn" data-color="red">红</button>
            </div>
          </div>
          <button id="btn-replay" class="ctrl-btn" type="button">▶ 重播动画</button>
          <span id="dot-count" class="count-tag"></span>
        </div>

        <div class="chart-area">
          <svg id="chart" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" aria-label="行业强弱分布散点图"></svg>
          <div id="tooltip" class="tooltip" role="tooltip"></div>
        </div>

        <p class="caption">30 个申万一级行业 · 数字=甜品度 · 圆大小=连续性(0-10) · 五个筛选：强弱 × 波动性 × 连续性 × 甜品度 × 颜色</p>
      </div>

    </article>
  </main>
